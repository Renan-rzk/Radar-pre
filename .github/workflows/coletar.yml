name: Coletar preços
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rodar coletor
        run: python collect.py
        continue-on-error: true
      - name: Salvar dados
        run: |
          git config user.name "price-hub-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data
          git diff --staged --quiet || git commit -m "dados: atualização automática"
          git push
